apiVersion: batch/v1
kind: Job
metadata:
  name: totp-migrate
  labels:
    app.kubernetes.io/name: totp-manager
    app.kubernetes.io/component: migrate
  annotations:
    # PreSync hook: runs before every sync that changes something, ahead of
    # all regular (non-hook) resources - no sync-wave needed. ArgoCD deletes
    # the previous hook Job itself (BeforeHookCreation) and recreates it, so
    # no ttlSecondsAfterFinished either - that combined with selfHeal was
    # causing the Job to be recreated on its own every ~10 minutes forever.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: totp-manager
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
#        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - 'until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER"; do echo "waiting for postgres..."; sleep 2; done'
          envFrom:
            - configMapRef:
                name: totp-config
      containers:
        - name: migrate
          image: totp-manager:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: totp-config
            - secretRef:
                name: totp-secret
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: totp.totp-psql.credentials.postgresql.acid.zalan.do
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi

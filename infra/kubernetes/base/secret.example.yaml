# EXAMPLE ONLY — not part of kustomization.yaml.
# Each overlay supplies its own Secret named "totp-secret" (the kind overlay
# does it as a sops+age encrypted SopsSecret CR, see overlays/kind/secret.yaml
# and infra/kubernetes/README.md — this plain form is just for reference/other
# overlays that don't use sops-secrets-operator).
# The DB password is NOT here — the postgres-operator generates it as
#   totp.totp-psql.credentials.postgresql.acid.zalan.do
# Generate real values:
#   ENCRYPTION_KEY: python -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
#   SECRET_KEY:     python -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(48)).decode())"
apiVersion: v1
kind: Secret
metadata:
  name: totp-secret
type: Opaque
stringData:
  ENCRYPTION_KEY: "change-me-44-char-fernet-key"
  SECRET_KEY: "change-me"
  MAILGUN_API_KEY: ""
  MAILGUN_DOMAIN: ""

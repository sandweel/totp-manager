# Optional dedicated kind cluster for this project:
#   kind create cluster --name totp --config infra/kubernetes/kind-cluster.yaml
#
# extraPortMappings expose the Traefik NodePort/LoadBalancer on localhost so
# http://totp.local works without port-forward (add "127.0.0.1 totp.local"
# to /etc/hosts).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
